[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bellhaven-crm-sync"
version = "0.1.0"
description = "Scrape Bellhaven communities, reconcile CRM accounts, and review changes before approval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bellhaven CRM Sync" }]
dependencies = ["certifi>=2024.2.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bellhaven-crm-sync = "bellhaven_crm_sync.cli:main"
